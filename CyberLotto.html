<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE BIN RATS // RAT-O-MATIC v2.7</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Permanent+Marker&display=swap');

  :root {
    --neon-cyan: #00fff5;
    --neon-pink: #ff00c8;
    --neon-yellow: #ffe600;
    --neon-green: #39ff14;
    --neon-orange: #ff6b00;
    --dark-bg: #0a0b0f;
    --panel-bg: rgba(8, 12, 20, 0.88);
    --rat-green: #39ff14;
    --rat-pink: #ff00c8;
    --rat-cyan: #00fff5;
    --rat-purple: #b026ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark-bg);
    color: #c0c8d8;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated grid */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(57,255,20,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,255,20,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -2;
  }

  /* Scanlines */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      to bottom, transparent 0px, transparent 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  .glitch-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(rgba(255,0,200,0.03), rgba(57,255,20,0.03));
    animation: flicker 8s infinite;
    pointer-events: none;
    z-index: 99;
  }

  @keyframes flicker {
    0%,100%{opacity:.3} 50%{opacity:.5} 92%{opacity:.3} 93%{opacity:.8} 94%{opacity:.3} 96%{opacity:.7} 97%{opacity:.3}
  }

  .terminal {
    background: var(--panel-bg);
    border: 1px solid rgba(57,255,20,0.35);
    border-radius: 4px;
    padding: 28px;
    max-width: 780px;
    width: 100%;
    position: relative;
    box-shadow:
      0 0 25px rgba(57,255,20,0.12),
      inset 0 0 40px rgba(57,255,20,0.04);
    backdrop-filter: blur(5px);
  }

  .terminal::before, .terminal::after {
    content: '';
    position: absolute;
    width: 22px; height: 22px;
    border-color: var(--rat-green);
    border-style: solid;
  }
  .terminal::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .terminal::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

  /* ── HEADER / GANG LOGO ─────────────────────────── */
  .header {
    text-align: center;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid rgba(57,255,20,0.25);
    position: relative;
  }

  .rat-mascot {
    font-size: 3rem;
    margin-bottom: 6px;
    display: inline-block;
    animation: rat-bob 3s ease-in-out infinite;
    filter: drop-shadow(0 0 8px var(--rat-green));
    cursor: pointer;
    transition: transform 0.2s;
  }
  .rat-mascot:hover { transform: scale(1.15) rotate(-5deg); }

  @keyframes rat-bob {
    0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}
  }

  .header h1 {
    font-family: 'Permanent Marker', cursive;
    font-size: 2.4rem;
    color: var(--rat-green);
    text-shadow:
      0 0 12px var(--rat-green),
      0 0 25px rgba(57,255,20,0.6),
      3px 3px 0 var(--rat-purple);
    letter-spacing: 2px;
    line-height: 1.1;
    margin-bottom: 4px;
  }

  .header .sub {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    color: var(--rat-pink);
    letter-spacing: 5px;
    text-transform: uppercase;
    text-shadow: 0 0 8px var(--rat-pink);
  }

  .tagline {
    font-family: 'Permanent Marker', cursive;
    font-size: 0.95rem;
    color: var(--neon-yellow);
    margin-top: 10px;
    text-shadow: 0 0 6px rgba(255,230,0,0.5);
    transform: rotate(-1deg);
    display: inline-block;
  }

  /* ── CREW STRIP ──────────────────────────────────── */
  .crew {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 20px;
    padding: 10px 0;
    border-bottom: 1px dashed rgba(57,255,20,0.15);
  }

  .crew-member {
    text-align: center;
    font-size: 0.6rem;
    letter-spacing: 1px;
    color: #6a7a8a;
    transition: all 0.3s;
  }
  .crew-member:hover { transform: scale(1.1); }
  .crew-member .icon { font-size: 1.4rem; display:block; margin-bottom:2px; filter: drop-shadow(0 0 5px currentColor); }
  .crew-member:nth-child(1) .icon { color: var(--rat-green); }
  .crew-member:nth-child(2) .icon { color: var(--rat-pink); }
  .crew-member:nth-child(3) .icon { color: var(--rat-cyan); }
  .crew-member:nth-child(4) .icon { color: var(--neon-orange); }

  /* ── SECTION LABELS ──────────────────────────────── */
  .section-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.72rem;
    color: var(--rat-pink);
    letter-spacing: 3px;
    margin-bottom: 14px;
    text-shadow: 0 0 6px var(--rat-pink);
  }

  /* ── NUMBER PANEL ────────────────────────────────── */
  .number-panel {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(57,255,20,0.2);
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 22px;
    min-height: 100px;
    position: relative;
  }

  .number-panel::before {
    content: '// LIVE FEED';
    position: absolute;
    top: 6px; right: 10px;
    font-size: 0.55rem;
    color: rgba(57,255,20,0.4);
    letter-spacing: 2px;
  }

  /* Single-line mode */
  .single-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
  }

  .number-group .label {
    font-size: 0.65rem;
    color: #5a6a7a;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-transform: uppercase;
    text-align: center;
  }

  .ball-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* Batch rows */
  .batch-rows { display: flex; flex-direction: column; gap: 10px; }

  .batch-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    background: rgba(57,255,20,0.04);
    border-left: 3px solid var(--rat-green);
    opacity: 0;
    transform: translateX(-20px);
    transition: all 0.4s ease;
  }

  .batch-row.visible { opacity: 1; transform: translateX(0); }

  .batch-num-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    color: var(--rat-green);
    min-width: 36px;
    text-shadow: 0 0 6px var(--rat-green);
  }

  .batch-balls { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ── BALLS ───────────────────────────────────────── */
  .ball {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    transition: all 0.3s ease;
  }

  .ball.main {
    background: radial-gradient(circle at 35% 35%, #0a2a1a, #051510);
    border: 2px solid var(--rat-green);
    color: var(--rat-green);
    box-shadow: 0 0 12px rgba(57,255,20,0.4), inset 0 0 15px rgba(57,255,20,0.1);
    text-shadow: 0 0 8px var(--rat-green);
  }

  .ball.star {
    background: radial-gradient(circle at 35% 35%, #2a0a25, #150510);
    border: 2px solid var(--rat-pink);
    color: var(--rat-pink);
    box-shadow: 0 0 12px rgba(255,0,200,0.4), inset 0 0 15px rgba(255,0,200,0.1);
    text-shadow: 0 0 8px var(--rat-pink);
  }

  .ball.small { width: 40px; height: 40px; font-size: 0.95rem; }
  .ball.star.small { width: 36px; height: 36px; font-size: 0.85rem; }

  .ball.roll-anim { animation: ball-drop 0.5s ease-out; }

  @keyframes ball-drop {
    0%   { transform: translateY(-15px) scale(1.2); opacity: 0; }
    60%  { transform: translateY(3px) scale(0.95); opacity: 1; }
    100% { transform: translateY(0) scale(1); }
  }

  .ball.cycling { animation: fast-cycle 0.08s infinite; }
  @keyframes fast-cycle {
    0%{filter:brightness(1.4)} 50%{filter:brightness(0.7)} 100%{filter:brightness(1.2)}
  }

  /* ── BUTTONS ─────────────────────────────────────── */
  .controls { display: flex; justify-content: center; gap: 18px; margin-bottom: 22px; flex-wrap: wrap; }

  .btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 13px 28px;
    background: transparent;
    border: 1px solid var(--rat-green);
    color: var(--rat-green);
    cursor: pointer;
    clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    transition: all 0.2s;
    text-transform: uppercase;
    position: relative;
  }

  .btn:hover {
    box-shadow: 0 0 20px rgba(57,255,20,0.35), inset 0 0 15px rgba(57,255,20,0.08);
    text-shadow: 0 0 8px var(--rat-green);
  }
  .btn:active { transform: scale(0.96); }

  .btn.secondary { border-color: var(--rat-pink); color: var(--rat-pink); }
  .btn.secondary:hover {
    box-shadow: 0 0 20px rgba(255,0,200,0.35), inset 0 0 15px rgba(255,0,200,0.08);
    text-shadow: 0 0 8px var(--rat-pink);
  }

  .btn.orange { border-color: var(--neon-orange); color: var(--neon-orange); }
  .btn.orange:hover {
    box-shadow: 0 0 20px rgba(255,107,0,0.35), inset 0 0 15px rgba(255,107,0,0.08);
    text-shadow: 0 0 8px var(--neon-orange);
  }

  /* ── LOG ─────────────────────────────────────────── */
  .log {
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(57,255,20,0.15);
    border-radius: 3px;
    padding: 14px;
    font-size: 0.72rem;
    color: #5a6a7a;
    max-height: 130px;
    overflow-y: auto;
    line-height: 1.7;
  }

  .log-entry { margin-bottom: 3px; }
  .log-entry .ts { color: var(--rat-green); }
  .log-entry .hl { color: var(--neon-yellow); text-shadow: 0 0 5px rgba(255,230,0,0.4); }

  /* ── STATUS BAR ──────────────────────────────────── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid rgba(57,255,20,0.18);
    font-size: 0.65rem;
    color: #4a5a6a;
    letter-spacing: 1px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .status-indicator {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--rat-green);
    box-shadow: 0 0 6px var(--rat-green);
    margin-right: 5px;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

  /* ── RESPONSIVE ──────────────────────────────────── */
  @media (max-width: 520px) {
    .ball { width: 42px; height: 42px; font-size: 1rem; }
    .ball.small { width: 34px; height: 34px; font-size: 0.8rem; }
    .terminal { padding: 18px; }
    .header h1 { font-size: 1.6rem; }
    .crew { gap: 12px; }
  }
</style>
</head>
<body>

<div class="glitch-overlay"></div>

<div class="terminal">

  <!-- HEADER -->
  <div class="header">
    <span class="rat-mascot" id="ratMascot" title="Click me!">🐀</span>
    <h1>THE BIN RATS</h1>
    <div class="sub">Rat-O-Matic // Lucky Number Synthesizer v2.7</div>
    <div class="tagline">"We eat the scraps, we take the pot!"</div>
  </div>

  <!-- CREW -->
  <div class="crew">
    <div class="crew-member"><span class="icon">🐀</span>GARBAGE<br>GIANTS</div>
    <div class="crew-member"><span class="icon">🐁</span>SQUEAK<br>SYNDICATE</div>
    <div class="crew-member"><span class="icon">🐭</span>TUNNEL<br>TRUST</div>
    <div class="crew-member"><span class="icon">🐇</span>ROOF<br>RATPACK</div>
  </div>

  <!-- NUMBER PANEL -->
  <div class="section-label">// THE RAT-O-MATIC FEED</div>
  <div class="number-panel" id="numberPanel">
    <!-- Content injected by JS -->
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="btn" onclick="generateSingle()">⟐ SQUEAK IT UP</button>
    <button class="btn secondary" onclick="quickBatch(5)">⚡ SWARM ×5</button>
    <button class="btn orange" onclick="luckyRat()">🧀 LUCKY RAT</button>
  </div>

  <!-- LOG -->
  <div class="log" id="log"></div>

  <!-- STATUS -->
  <div class="status-bar">
    <span><span class="status-indicator"></span>RAT-NET ONLINE</span>
    <span>NODE: LONDON-DUMP-7 :: UPLINK 12ms</span>
  </div>

</div>

<script>
const MAIN_COUNT = 5;
const STAR_COUNT = 2;
const MAIN_RANGE = [1, 50];
const STAR_RANGE = [1, 12];

const RAT_LINES = [
  "Squeak! Numbers synthesized.",
  "The Bin Rats approve this sequence.",
  "Garbage in, fortune out. Classic rat logic.",
  "Tunnel vision detected... numbers locked.",
  "Cheese acquired. Proceed with caution.",
  "The Squeak Syndicate is watching.",
  "Roof Ratpack verified the hash.",
  "Scrap-metal luck engaged.",
  "Bin Rats hit the jackpot zone!",
  "Damp, dark, and profitable."
];

const LUCKY_RAT_LINES = [
  "🧀 THE LUCKY RAT STRIKES! Special sequence loaded!",
  "🧀 A golden rat appeared! Numbers blessed with cheese energy!",
  "🧀 The Bin Rats' legendary Lucky Rat has spoken!",
  "🧀 Cheese-powered randomness engaged! Maximum luck probability!"
];

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateUnique(count, min, max) {
  const set = new Set();
  while (set.size < count) set.add(randomInt(min, max));
  return Array.from(set).sort((a, b) => a - b);
}

function createBall(number, type, small = false) {
  const ball = document.createElement('div');
  ball.className = `ball ${type}${small ? ' small' : ''}`;
  ball.textContent = number.toString().padStart(2, '0');
  return ball;
}

function createPlaceholderBall(type, small = false) {
  return createBall('??', type, small);
}

function log(msg, highlight = false) {
  const logEl = document.getElementById('log');
  const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<span class="ts">[${time}]</span> <span class="${highlight ? 'hl' : ''}">${msg}</span>`;
  logEl.appendChild(entry);
  logEl.scrollTop = logEl.scrollHeight;
  while (logEl.children.length > 60) logEl.removeChild(logEl.firstChild);
}

/* ── SINGLE GENERATION ─────────────────────────────── */
function generateSingle() {
  const mains = generateUnique(MAIN_COUNT, ...MAIN_RANGE);
  const stars = generateUnique(STAR_COUNT, ...STAR_RANGE);

  const panel = document.getElementById('numberPanel');
  panel.innerHTML = '';

  const row = document.createElement('div');
  row.className = 'single-row';

  // Main group
  const mainGroup = document.createElement('div');
  mainGroup.className = 'number-group';
  const mainLabel = document.createElement('div');
  mainLabel.className = 'label';
  mainLabel.textContent = 'MAIN NUMBERS [1-50]';
  mainGroup.appendChild(mainLabel);

  const mainRow = document.createElement('div');
  mainRow.className = 'ball-row';
  for (let i = 0; i < MAIN_COUNT; i++) {
    const ph = createPlaceholderBall('main');
    mainRow.appendChild(ph);
  }
  mainGroup.appendChild(mainRow);
  row.appendChild(mainGroup);

  // Star group
  const starGroup = document.createElement('div');
  starGroup.className = 'number-group';
  const starLabel = document.createElement('div');
  starLabel.className = 'label';
  starLabel.textContent = 'LUCKY STARS [1-12]';
  starGroup.appendChild(starLabel);

  const starRow = document.createElement('div');
  starRow.className = 'ball-row';
  for (let i = 0; i < STAR_COUNT; i++) {
    const ph = createPlaceholderBall('star');
    starRow.appendChild(ph);
  }
  starGroup.appendChild(starRow);
  row.appendChild(starGroup);

  panel.appendChild(row);

  // Animate main balls cycling then locking
  animateBallsSequential(mainRow, mains, 'main', () => {
    setTimeout(() => animateBallsSequential(starRow, stars, 'star'), 200);
  });

  log(`SYNTHESIS → MAIN: [${mains.join(', ')}] | STARS: [${stars.join(', ')}]`, true);
  log(pickRandom(RAT_LINES));
}

function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function animateBallsSequential(container, numbers, type, onDone) {
  const balls = Array.from(container.querySelectorAll('.ball'));
  let idx = 0;

  function step() {
    if (idx >= numbers.length) {
      if (onDone) onDone();
      return;
    }
    const ball = balls[idx];
    ball.classList.add('cycling');

    const cycleInterval = setInterval(() => {
      ball.textContent = randomInt(1, type === 'main' ? 50 : 12).toString().padStart(2, '0');
    }, 60);

    setTimeout(() => {
      clearInterval(cycleInterval);
      ball.classList.remove('cycling');
      ball.textContent = numbers[idx].toString().padStart(2, '0');
      ball.classList.add('roll-anim');
      setTimeout(() => ball.classList.remove('roll-anim'), 500);
      idx++;
      setTimeout(step, 180);
    }, 500 + Math.random() * 400);
  }

  step();
}

/* ── QUICK BATCH ×5 ────────────────────────────────── */
function quickBatch(count) {
  const panel = document.getElementById('numberPanel');
  panel.innerHTML = '';

  const container = document.createElement('div');
  container.className = 'batch-rows';
  panel.appendChild(container);

  const batch = [];
  for (let i = 0; i < count; i++) {
    batch.push({
      mains: generateUnique(MAIN_COUNT, ...MAIN_RANGE),
      stars: generateUnique(STAR_COUNT, ...STAR_RANGE)
    });
  }

  let rowIdx = 0;

  function showNextRow() {
    if (rowIdx >= batch.length) return;

    const b = batch[rowIdx];
    const rowEl = document.createElement('div');
    rowEl.className = 'batch-row';

    const label = document.createElement('div');
    label.className = 'batch-num-label';
    label.textContent = `RAT-${rowIdx + 1}`;
    rowEl.appendChild(label);

    const ballsDiv = document.createElement('div');
    ballsDiv.className = 'batch-balls';

    // Main balls (placeholders)
    const mainBalls = [];
    for (let i = 0; i < MAIN_COUNT; i++) {
      const ph = createPlaceholderBall('main', true);
      ballsDiv.appendChild(ph);
      mainBalls.push(ph);
    }

    // Separator
    const sep = document.createElement('div');
    sep.style.cssText = 'color:#5a6a7a;font-size:0.8rem;margin:0 4px;';
    sep.textContent = '+★';
    ballsDiv.appendChild(sep);

    // Star balls (placeholders)
    const starBalls = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      const ph = createPlaceholderBall('star', true);
      ballsDiv.appendChild(ph);
      starBalls.push(ph);
    }

    rowEl.appendChild(ballsDiv);
    container.appendChild(rowEl);

    // Trigger entry animation
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        rowEl.classList.add('visible');
      });
    });

    // Cycle main balls
    let mIdx = 0;
    const mInterval = setInterval(() => {
      if (mIdx < mainBalls.length) {
        mainBalls[mIdx].classList.add('cycling');
      }
    }, 80);

    setTimeout(() => {
      // Lock in mains with staggered drop
      mainBalls.forEach((ball, i) => {
        ball.classList.remove('cycling');
        setTimeout(() => {
          ball.textContent = b.mains[i].toString().padStart(2, '0');
          ball.classList.add('roll-anim');
          setTimeout(() => ball.classList.remove('roll-anim'), 500);
        }, i * 120);
      });

      // Then cycle + lock stars
      let sIdx = 0;
      const sInterval = setInterval(() => {
        if (sIdx < starBalls.length) {
          starBalls[sIdx].classList.add('cycling');
        }
      }, 80);

      setTimeout(() => {
        starBalls.forEach((ball, i) => {
          ball.classList.remove('cycling');
          setTimeout(() => {
            ball.textContent = b.stars[i].toString().padStart(2, '0');
            ball.classList.add('roll-anim');
            setTimeout(() => ball.classList.remove('roll-anim'), 500);
          }, i * 120);
        });

        rowIdx++;
        if (rowIdx < batch.length) {
          setTimeout(showNextRow, 300);
        } else {
          // Log all
          const summary = batch.map((bb, ii) => `RAT-${ii + 1}: [${bb.mains.join(',')}] +★[${bb.stars.join(',')}]`).join(' | ');
          log(`SWARM SYNTHESIS ×${count} → ${summary}`, true);
          log(pickRandom(RAT_LINES));
        }
      }, 600);
    }, 700);
  }

  showNextRow();
}

/* ── LUCKY RAT (special easter egg) ────────────────── */
function luckyRat() {
  const mains = generateUnique(MAIN_COUNT, ...MAIN_RANGE);
  const stars = generateUnique(STAR_COUNT, ...STAR_RANGE);

  // Force a "lucky" feel: sort and add special log
  generateSingle.call(null);
  setTimeout(() => {
    // Override with lucky message
    log(pickRandom(LUCKY_RAT_LINES), true);
    document.getElementById('ratMascot').style.transform = 'scale(1.4) rotate(-10deg)';
    setTimeout(() => {
      document.getElementById('ratMascot').style.transform = '';
    }, 600);
  }, 500);
}

/* ── RAT MASCOT CLICK ──────────────────────────────── */
document.getElementById('ratMascot').addEventListener('click', function() {
  this.style.transform = 'scale(1.3) rotate(15deg)';
  setTimeout(() => { this.style.transform = ''; }, 400);
  const squeaks = ['SQUEAK!', '*squeak*', 'RAT-ROCK!!', '*tail flick*', 'GARBAGE FUNK!'];
  log(`🐀 The rat mascot: "${pickRandom(squeaks)}"`);
});
